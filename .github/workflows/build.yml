# Builds the Windows and Mac apps, only when asked (they use paid minutes on a private repo; Mac minutes count 10x):
#   - by hand: Actions tab > Build the apps > Run workflow
#   - for a release: push a tag like v0.2.0; the zips then also go on a GitHub Release, a lasting download link
# Each build runs the tests, builds the app with dev/build_exe.py, and checks the built app loads every part it needs
# (--selftest). Downloads: open the run > Artifacts (Combo-Manager-windows / -mac-arm64 / -mac-intel).
name: Build the apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:                 # a newer build of the same thing cancels an older one still running
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write          # only used to attach the zip to a Release (tags)

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the packages (the pinned versions) and PyInstaller
        run: pip install -r requirements.txt pyinstaller

      - name: Tests (on Windows)
        run: python dev/test_rules.py

      - name: Build
        run: python dev/build_exe.py

      - name: The built app loads every part it needs
        shell: pwsh
        run: |
          $out = Join-Path $PWD "selftest.txt"
          $p = Start-Process -FilePath "dist\Combo Manager\Combo Manager.exe" -ArgumentList "--selftest", "`"$out`"" -Wait -PassThru
          Get-Content $out
          if ($p.ExitCode -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: Combo-Manager-windows
          path: dist/Combo Manager/
          include-hidden-files: true   # the solver's DLLs are in _internal/ortools/.libs: left out otherwise ("DLL load failed")
          retention-days: 30

      - name: Attach to a Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Combo-Manager-windows.zip

  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14             # Apple Silicon
            arch: arm64
          - runner: macos-15-intel       # Intel Macs
            arch: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the packages (the pinned versions) and PyInstaller
        run: pip install -r requirements.txt pyinstaller

      - name: Tests (on a Mac)
        run: python dev/test_rules.py

      - name: Build
        run: python dev/build_exe.py

      - name: The built app loads every part it needs
        run: |
          "dist/Combo Manager.app/Contents/MacOS/Combo Manager" --selftest "$PWD/selftest.txt"; code=$?
          cat selftest.txt
          exit $code

      - uses: actions/upload-artifact@v4   # the zip itself: uploading the .app folder would break it (symlinks)
        with:
          name: Combo-Manager-mac-${{ matrix.arch }}
          path: dist/Combo-Manager-mac-${{ matrix.arch }}.zip
          retention-days: 30

      - name: Attach to a Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Combo-Manager-mac-${{ matrix.arch }}.zip
